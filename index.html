<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12070c">
  <meta name="description" content="Неделя сюрпризов — для тебя">
  <meta property="og:title" content="Неделя для тебя ♥">
  <meta property="og:description" content="Семь дней. Семь маленьких сюрпризов.">
  <meta property="og:type" content="website">
  <title>Неделя для тебя ♥</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff5d7a' d='M12 21.2s-7.6-4.7-9.7-9.4C.8 8.3 3 4.4 6.8 4.4c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 6 3.9 4.5 7.4-2.1 4.7-9.7 9.4-9.7 9.4z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffb3c0"/><stop offset=".55" stop-color="#ff5d7a"/><stop offset="1" stop-color="#c2244a"/>
      </linearGradient>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f2c48d"/><stop offset="1" stop-color="#ff5d7a"/>
      </linearGradient>
    </defs>
  </svg>

  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <button id="sound" class="icon-btn sound-btn" type="button" aria-label="Звук" aria-pressed="true">
    <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>

  <main id="app">
    <section id="intro" class="screen is-active">
      <p class="eyebrow reveal" style="--i:0">для <span data-her></span></p>
      <h1 class="display reveal" style="--i:1">Неделя,<br><em>полная тебя</em></h1>
      <p class="lead reveal" style="--i:2" data-intro></p>
      <div class="reveal" style="--i:3">
        <button id="holdHeart" class="hold-heart" type="button" aria-label="Нажми и удерживай сердце, чтобы войти">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="56"/>
            <circle class="ring-progress" cx="60" cy="60" r="56"/>
          </svg>
          <span class="heart-scale"><svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2s-7.6-4.7-9.7-9.4C.8 8.3 3 4.4 6.8 4.4c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 6 3.9 4.5 7.4-2.1 4.7-9.7 9.4-9.7 9.4z"/></svg></span>
        </button>
      </div>
      <p class="hint reveal" style="--i:4">Нажми и удерживай сердце</p>
    </section>

    <section id="hub" class="screen">
      <header class="hub-head">
        <p class="eyebrow reveal" style="--i:0">7 дней · 7 сюрпризов</p>
        <h2 class="display reveal" style="--i:1">Привет, <em data-her></em></h2>
        <p class="lead reveal" style="--i:2" data-hub></p>
      </header>
      <div id="days" class="days"></div>
      <footer class="hub-foot reveal" style="--i:6">
        <span id="progressText"></span>
        <div class="progress"><i></i></div>
        <p class="made">сделано с любовью ♥</p>
      </footer>
    </section>
  </main>

  <section id="scene" class="scene" hidden aria-modal="true" role="dialog">
    <div class="scene-top">
      <button id="sceneBack" class="icon-btn back-btn" type="button" aria-label="Ко всем дням">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
    <div id="sceneBody" class="scene-inner"></div>
  </section>

  <div id="fx" aria-hidden="true"></div>

  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/days.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
